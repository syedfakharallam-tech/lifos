
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeOS - Daily Routine Tracker</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    padding: 20px;
    background: #101827;
    color: white;
}

.container {
    max-width: 850px;
    margin: auto;
}

header {
    text-align: center;
    margin-bottom: 25px;
}

header h1 {
    color: #38bdf8;
    font-size: 36px;
}

header p, .small {
    color: #94a3b8;
}

.card {
    background: #1e293b;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 18px;
}

h2 {
    color: #38bdf8;
    margin-top: 0;
    font-size: 21px;
}

input, select, textarea {
    width: 100%;
    padding: 12px;
    margin: 7px 0;
    border: 1px solid #475569;
    background: #0f172a;
    color: white;
    border-radius: 7px;
    font-size: 15px;
}

button {
    border: none;
    border-radius: 7px;
    padding: 10px 14px;
    margin: 3px;
    cursor: pointer;
    font-weight: bold;
}

.yes { background: #16a34a; color: white; }
.no { background: #dc2626; color: white; }
.pending { background: #64748b; color: white; }
.delete { background: #475569; color: white; }
.add { background: #0284c7; color: white; }

.submit, .whatsapp, .copy {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    margin-top: 12px;
    color: white;
}

.submit { background: #0d9488; }
.whatsapp { background: #16a34a; }
.copy { background: #2563eb; }

.task {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px 0;
    border-bottom: 1px solid #334155;
}

.task-name {
    flex: 1;
    min-width: 130px;
}

.task-buttons {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
}

.task-status {
    color: #cbd5e1;
    font-size: 12px;
    margin: 0 5px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

.stat {
    background: #0f172a;
    padding: 15px 5px;
    text-align: center;
    border-radius: 8px;
}

.stat strong {
    display: block;
    font-size: 24px;
    color: #38bdf8;
}

.stat span {
    color: #94a3b8;
    font-size: 12px;
}

#report {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.9;
    background: #0f172a;
    border: 1px solid #475569;
    border-radius: 8px;
    padding: 16px;
    margin-top: 15px;
    font-size: 15px;
}

.small {
    font-size: 13px;
    line-height: 1.7;
}

.language-box {
    max-width: 250px;
    margin: 15px auto;
}

@media(max-width: 550px) {
    body { padding: 10px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    header h1 { font-size: 29px; }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>LifeOS 🌙</h1>
    <p id="subtitle"></p>

    <div class="language-box">
        <label id="languageLabel"></label>
        <select id="language">
            <option value="en">English 🇬🇧</option>
            <option value="ur">اردو 🇵🇰</option>
        </select>
    </div>
</header>

<div class="card">
    <h2 id="dateHeading"></h2>

    <label id="dateLabel"></label>
    <input type="date" id="date">

    <label id="wakeLabel"></label>
    <input type="time" id="wakeTime">

    <label id="sleepLabel"></label>
    <input type="time" id="sleepTime">

    <p class="small" id="dateHelp"></p>
</div>

<div class="card">
    <h2 id="mainHeading"></h2>
    <div id="mainTasks"></div>
</div>

<div class="card">
    <h2 id="otherHeading"></h2>
    <div id="otherTasks"></div>
</div>

<div class="card">
    <h2 id="addHeading"></h2>

    <input type="text" id="newTask">

    <select id="taskCategory">
        <option value="main" id="mainOption"></option>
        <option value="other" id="otherOption"></option>
    </select>

    <button class="add" id="addButton" onclick="addTask()"></button>
    <p class="small" id="customHelp"></p>
</div>

<div class="card">
    <h2 id="noteHeading"></h2>
    <textarea id="dailyNote" rows="3"></textarea>
</div>

<div class="card">
    <h2 id="statsHeading"></h2>

    <div class="stats">
        <div class="stat">
            <strong id="total">0</strong>
            <span id="totalLabel"></span>
        </div>

        <div class="stat">
            <strong id="completed">0</strong>
            <span id="completedLabel"></span>
        </div>

        <div class="stat">
            <strong id="missed">0</strong>
            <span id="missedLabel"></span>
        </div>

        <div class="stat">
            <strong id="percentage">0%</strong>
            <span id="percentageLabel"></span>
        </div>
    </div>

    <p class="small" id="pendingCount"></p>
</div>

<div class="card">
    <h2 id="reportHeading"></h2>

    <button class="submit" id="generateButton"
        onclick="generateReport()"></button>

    <div id="reportSection" style="display:none">

        <div id="report"></div>

        <button class="copy" id="copyButton"
            onclick="copyReport()"></button>

        <h2 id="whatsappHeading" style="margin-top:25px"></h2>

        <label id="phoneLabel"></label>

        <input type="tel" id="phone">

        <button class="whatsapp" id="sendButton"
            onclick="sendWhatsApp()"></button>

        <p class="small" id="whatsappHelp"></p>
    </div>
</div>

</div>

// ------------------------------------
// 2. DEFAULT HABITS
// ------------------------------------

    {id:1, en:"Tahajjud", ur:"تہجد", category:"main"},

// ------------------------------------
// 3. LOAD DATA
// ------------------------------------

let language = localStorage.getItem("lifeos_language") || "en";

let tasks = JSON.parse(
    localStorage.getItem("lifeos_bilingual_tasks")
) || defaultTasks;

let records = JSON.parse(
    localStorage.getItem("lifeos_bilingual_records")
) || {};

let reportText = "";

// ------------------------------------
// 4. LANGUAGE FUNCTIONS
// ------------------------------------

function t(key) {
    return translations[language][key];
}

function getTaskName(task) {
    return task[language] || task.en || task.ur;
}

function setLanguage() {

    language = document.getElementById("language").value;

    localStorage.setItem("lifeos_language", language);

    document.documentElement.lang = language;
    document.documentElement.dir = language === "ur" ? "rtl" : "ltr";

    applyLanguage();
    renderTasks();
}

function applyLanguage() {

    const ids = {
        subtitle: "subtitle",
        language: "languageLabel",
        dateHeading: "dateHeading",
        dateLabel: "dateLabel",
        wakeLabel: "wakeLabel",
        sleepLabel: "sleepLabel",
        dateHelp: "dateHelp",
        mainHeading: "mainHeading",
        otherHeading: "otherHeading",
        addHeading: "addHeading",
        mainOption: "mainOption",
        otherOption: "otherOption",
        addButton: "addButton",
        customHelp: "customHelp",
        noteHeading: "noteHeading",
        statsHeading: "statsHeading",
        total: "totalLabel",
        completed: "completedLabel",
        missed: "missedLabel",
        percentage: "percentageLabel",
        reportHeading: "reportHeading",
        generate: "generateButton",
        copy: "copyButton",
        whatsappHeading: "whatsappHeading",
        phoneLabel: "phoneLabel",
        send: "sendButton",
        whatsappHelp: "whatsappHelp"
    };

    for (const key in ids) {
        document.getElementById(ids[key]).textContent = t(key);
    }

    document.getElementById("newTask").placeholder = t("newTask");
    document.getElementById("dailyNote").placeholder = t("notePlaceholder");
    document.getElementById("phone").placeholder = t("phonePlaceholder");

    document.getElementById("language").value = language;
}

// ------------------------------------
// 5. DATE FUNCTIONS
// ------------------------------------

function todayDate() {

    const now = new Date();

    return now.getFullYear() + "-" +
        String(now.getMonth() + 1).padStart(2, "0") + "-" +
        String(now.getDate()).padStart(2, "0");
}

document.getElementById("date").value = todayDate();

function selectedDate() {
    return document.getElementById("date").value;
}

function getDayRecord() {

    const date = selectedDate();

    if (!records[date]) {
        records[date] = {
            statuses: {},
            wakeTime: "",
            sleepTime: "",
            note: ""
        };
    }

    if (!records[date].statuses) {
        records[date].statuses = {};
    }

    return records[date];
}

// ------------------------------------
// 6. SAVE DATA
// ------------------------------------

function saveData() {

    localStorage.setItem(
        "lifeos_bilingual_tasks",
        JSON.stringify(tasks)
    );

    localStorage.setItem(
        "lifeos_bilingual_records",
        JSON.stringify(records)
    );
}

function saveDailyDetails() {

    const record = getDayRecord();

    record.wakeTime = document.getElementById("wakeTime").value;
    record.sleepTime = document.getElementById("sleepTime").value;
    record.note = document.getElementById("dailyNote").value;

    saveData();
}

// ------------------------------------
// 7. RENDER TASKS
// ------------------------------------

function renderTasks() {

    const record = getDayRecord();

    const main = document.getElementById("mainTasks");
    const other = document.getElementById("otherTasks");

    main.innerHTML = "";
    other.innerHTML = "";

    tasks.forEach(task => {

        const status = record.statuses[task.id] || "";

        const row = document.createElement("div");
        row.className = "task";

        const name = document.createElement("div");
        name.className = "task-name";
        name.textContent = getTaskName(task);

        const buttons = document.createElement("div");
        buttons.className = "task-buttons";

        const label = document.createElement("span");
        label.className = "task-status";

        if (status === "yes") {
            label.textContent = t("yes");
        } else if (status === "no") {
            label.textContent = t("no");
        } else {
            label.textContent = t("blank");
        }

        const yes = document.createElement("button");
        yes.className = "yes";
        yes.textContent = "✓";
        yes.title = t("completed");
        yes.onclick = () => markTask(task.id, "yes");

        const no = document.createElement("button");
        no.className = "no";
        no.textContent = "✗";
        no.title = t("missed");
        no.onclick = () => markTask(task.id, "no");

        const blank = document.createElement("button");
        blank.className = "pending";
        blank.textContent = "—";
        blank.title = t("pending");
        blank.onclick = () => markTask(task.id, "");

        const del = document.createElement("button");
        del.className = "delete";
        del.textContent = t("delete");
        del.onclick = () => deleteTask(task.id);

        buttons.append(label, yes, no, blank, del);
        row.append(name, buttons);

        if (task.category === "main") {
            main.appendChild(row);
        } else {
            other.appendChild(row);
        }
    });

    document.getElementById("wakeTime").value = record.wakeTime || "";
    document.getElementById("sleepTime").value = record.sleepTime || "";
    document.getElementById("dailyNote").value = record.note || "";

    updateStats();
    hideReport();
}

// ------------------------------------
// 8. MARK TASK
// ------------------------------------

function markTask(id, status) {

    const record = getDayRecord();

    if (status === "") {
        delete record.statuses[id];
    } else {
        record.statuses[id] = status;
    }

    saveData();
    renderTasks();
}

// ------------------------------------
// 9. ADD TASK
// ------------------------------------

function addTask() {

    const input = document.getElementById("newTask");
    const name = input.value.trim();

    if (!name) {
        alert(t("noName"));
        return;
    }

    const newId = tasks.length
        ? Math.max(...tasks.map(task => task.id)) + 1
        : 1;

    const newTask = {
        id: newId,
        en: name,
        ur: name,
        category: document.getElementById("taskCategory").value
    };

    tasks.push(newTask);

    input.value = "";

    saveData();
    renderTasks();
}

// ------------------------------------
// 10. DELETE TASK
// ------------------------------------

function deleteTask(id) {

    if (!confirm(t("confirmDelete"))) return;

    tasks = tasks.filter(task => task.id !== id);

    for (const date in records) {
        delete records[date].statuses[id];
    }

    saveData();
    renderTasks();
}

// ------------------------------------
// 11. STATISTICS
// ------------------------------------

function calculateStats() {

    const record = getDayRecord();

    let completed = 0;
    let missed = 0;
    let pending = 0;

    tasks.forEach(task => {

        const status = record.statuses[task.id];

        if (status === "yes") {
            completed++;
        } else if (status === "no") {
            missed++;
        } else {
            pending++;
        }
    });

    const total = tasks.length;

    const percentage = total > 0
        ? Math.round((completed / total) * 1000) / 10
        : 0;

    return {total, completed, missed, pending, percentage};
}

function updateStats() {

    const s = calculateStats();

    document.getElementById("total").textContent = s.total;
    document.getElementById("completed").textContent = s.completed;
    document.getElementById("missed").textContent = s.missed;
    document.getElementById("percentage").textContent = s.percentage + "%";

    document.getElementById("pendingCount").textContent =
        t("pending") + ": " + s.pending;
}

// ------------------------------------
// 12. FORMAT DATE AND TIME
// ------------------------------------

function formatDate(date) {

    if (!date) return language === "ur" ? "درج نہیں" : "Not entered";

    const parts = date.split("-");

    const d = new Date(
        Number(parts[0]),
        Number(parts[1]) - 1,
        Number(parts[2])
    );

    return new Intl.DateTimeFormat(
        language === "ur" ? "ur-PK" : "en-GB",
        {
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    ).format(d);
}

function formatTime(time) {

    if (!time) return language === "ur" ? "درج نہیں" : "Not entered";

    const [hour, minute] = time.split(":");
    let h = Number(hour);

    if (language === "ur") {
        const period = h >= 12 ? "شام" : "صبح";
        h = h % 12 || 12;
        return `${h}:${minute} ${period}`;
    }

    const period = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;

    return `${h}:${minute} ${period}`;
}

// ------------------------------------
// 13. GENERATE REPORT
// ------------------------------------

function generateReport() {

    if (!selectedDate()) {
        alert(t("noDate"));
        return;
    }

    if (tasks.length === 0) {
        alert(t("noTasks"));
        return;
    }

    saveDailyDetails();

    const record = getDayRecord();
    const stats = calculateStats();

    const lines = [];

    lines.push(
        language === "ur"
            ? "🌙 *روزانہ معمولات کی رپورٹ*"
            : "🌙 *DAILY ROUTINE REPORT*"
    );

    lines.push("━━━━━━━━━━━━━━━━━━");

    lines.push(t("dateReport") + ": " + formatDate(selectedDate()));
    lines.push(t("wakeReport") + ": " + formatTime(record.wakeTime));
    lines.push(t("sleepReport") + ": " + formatTime(record.sleepTime));

    function addCategory(category, heading) {

        lines.push("");
        lines.push("*" + heading + "*");
        lines.push("━━━━━━━━━━━━━━━━━━");

        let number = 1;

        tasks.filter(task => task.category === category)
        .forEach(task => {

            const status = record.statuses[task.id];

            let symbol = "➖";
            let label = t("blankWord");

            if (status === "yes") {
                symbol = "✅";
                label = t("completedWord");
            } else if (status === "no") {
                symbol = "❌";
                label = t("missedWord");
            }

            lines.push(
                number + ". " + getTaskName(task) +
                " — " + symbol + " " + label
            );

            number++;
        });
    }

    addCategory("main", t("mainReport"));
    addCategory("other", t("otherReport"));

    if (record.note.trim()) {
        lines.push("");
        lines.push("*" + t("noteReport") + "*");
        lines.push(record.note.trim());
    }

    lines.push("");
    lines.push("*" + t("summary") + "*");
    lines.push("━━━━━━━━━━━━━━━━━━");

    lines.push(t("totalReport") + ": " + stats.total);
    lines.push("✅ " + t("completedReport") + ": " + stats.completed);
    lines.push("❌ " + t("missedReport") + ": " + stats.missed);
    lines.push("➖ " + t("pendingReport") + ": " + stats.pending);
    lines.push(t("rate") + ": " + stats.percentage + "%");

    lines.push("");
    lines.push(t("footer"));
    lines.push("_" + t("generated") + "_");

    reportText = lines.join("\n");

    document.getElementById("report").textContent = reportText;
    document.getElementById("reportSection").style.display = "block";

    saveData();
}

// ------------------------------------
// 14. COPY REPORT
// ------------------------------------

async function copyReport() {

    if (!reportText) {
        alert(t("generateFirst"));
        return;
    }

    try {
        await navigator.clipboard.writeText(reportText);
        alert(t("copied"));
    } catch (error) {
        alert(t("copyError"));
    }
}

// ------------------------------------
// 15. WHATSAPP
// ------------------------------------

function sendWhatsApp() {

    if (!reportText) {
        alert(t("generateFirst"));
        return;
    }

    const phone = document.getElementById("phone").value;
    const digits = phone.replace(/\D/g, "");

    if (digits.length < 10 || digits.length > 15) {
        alert(t("invalidPhone"));
        return;
    }

    const url =
        "https://wa.me/" + digits +
        "?text=" + encodeURIComponent(reportText);

    window.open(url, "_blank");
}

// ------------------------------------
// 16. HIDE OLD REPORT
// ------------------------------------

function hideReport() {

    reportText = "";

    document.getElementById("reportSection").style.display = "none";
}

// ------------------------------------
// 17. EVENT LISTENERS
// ------------------------------------

document.getElementById("language").addEventListener(
    "change",
    setLanguage
);

document.getElementById("date").addEventListener(
    "change",
    renderTasks
);

document.getElementById("wakeTime").addEventListener(
    "change",
    saveDailyDetails
);

document.getElementById("sleepTime").addEventListener(
    "change",
    saveDailyDetails
);

document.getElementById("dailyNote").addEventListener(
    "input",
    saveDailyDetails
);

// ------------------------------------
// 18. START APPLICATION
// ------------------------------------

document.getElementById("language").value = language;

applyLanguage();
renderTasks();

</script>
