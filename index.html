<style>

/* ==============================
   1. GLOBAL DESIGN
============================== */

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

:root {
    --bg: #0B0F19;
    --card: #111827;
    --input: #0B1220;
    --text: #F1F5F9;
    --muted: #94A3B8;
    --accent: #38BDF8;
    --green: #4ADE80;
    --red: #F87171;
    --border: rgba(255,255,255,0.06);
}

body {
    margin: 0;
    padding: 28px 20px;
    background: var(--bg);
    color: var(--text);
}

.container {
    max-width: 950px;
    margin: auto;
}

/* ==============================
   2. HEADER
============================== */

header {
    margin-bottom: 30px;
}

header h1 {
    color: var(--text);
    font-size: 30px;
    margin-bottom: 8px;
}

header p {
    color: var(--muted);
    font-size: 14px;
}

.language-box {
    max-width: 220px;
    margin-top: 18px;
}

/* ==============================
   3. CARDS
============================== */

.card {
    background: var(--card);
    padding: 22px;
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 18px;
}

h2 {
    color: var(--text);
    margin: 0 0 18px;
    font-size: 18px;
    font-weight: 600;
}

/* ==============================
   4. INPUTS
============================== */

input, select, textarea {
    width: 100%;
    padding: 12px;
    margin: 8px 0 16px;
    border: 1px solid var(--border);
    background: var(--input);
    color: var(--text);
    border-radius: 6px;
    font-size: 14px;
    outline: none;
}

input:focus,
select:focus,
textarea:focus {
    border-color: rgba(56,189,248,0.5);
}

label {
    color: var(--muted);
    font-size: 13px;
}

/* ==============================
   5. BUTTONS
============================== */

button {
    border: none;
    border-radius: 6px;
    padding: 8px 11px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    transition: 0.2s ease;
}

button:hover {
    opacity: 0.85;
}

/* ==============================
   6. HABIT ROWS
============================== */

.task {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 12px;
    padding: 14px 12px;
    border-bottom: 1px solid var(--border);
    border-radius: 6px;
    transition: background 0.2s ease;
}

.task:nth-child(even) {
    background: rgba(255,255,255,0.018);
}

.task:hover {
    background: rgba(255,255,255,0.045);
}

.task-name {
    display: flex;
    align-items: center;
    gap: 11px;
    min-width: 0;
    font-size: 14px;
    line-height: 1.5;
}

/* Status indicator */

.status-dot {
    width: 19px;
    height: 19px;
    flex-shrink: 0;
    border: 1.5px solid #64748B;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
}

.status-dot.yes {
    color: var(--green);
    border-color: var(--green);
}

.status-dot.no {
    color: var(--red);
    border-color: var(--red);
}

.status-dot.skip {
    color: var(--muted);
    border-color: var(--muted);
}

/* Habit actions */

.task-buttons {
    display: flex;
    align-items: center;
    gap: 5px;
    opacity: 0;
    visibility: hidden;
    transition: 0.2s ease;
}

.task:hover .task-buttons,
.task:focus-within .task-buttons {
    opacity: 1;
    visibility: visible;
}

.task-buttons button {
    background: transparent;
    color: var(--muted);
    padding: 6px 8px;
}

.task-buttons .complete-action:hover {
    color: var(--green);
    background: rgba(74,222,128,0.08);
}

.task-buttons .skip-action:hover {
    color: var(--accent);
    background: rgba(56,189,248,0.08);
}

.task-buttons .fail-action:hover {
    color: var(--red);
    background: rgba(248,113,113,0.08);
}

.task-buttons .delete {
    color: #64748B;
    margin-left: 5px;
}

.task-buttons .delete:hover {
    color: var(--red);
}

/* ==============================
   7. PROGRESS STATISTICS
============================== */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    padding: 10px 0;
}

.stat {
    background: transparent;
    padding: 8px 0;
    text-align: left;
}

.stat strong {
    display: block;
    font-size: 29px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 7px;
}

.stat span {
    color: var(--muted);
    font-size: 12px;
}

/* ==============================
   8. ADD HABIT
============================== */

.add {
    background: #164E63;
    color: #BAE6FD;
    padding: 12px 18px;
}

.add:hover {
    background: #155E75;
}

/* ==============================
   9. REPORT BUTTONS
============================== */

.submit,
.whatsapp,
.copy {
    width: 100%;
    padding: 14px;
    font-size: 14px;
    margin-top: 12px;
    color: white;
}

.submit {
    background: #164E63;
    color: #BAE6FD;
}

.whatsapp {
    background: #166534;
    color: #DCFCE7;
}

.copy {
    background: #1E3A8A;
    color: #DBEAFE;
}

/* ==============================
   10. REPORT DISPLAY
============================== */

#report {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.9;
    background: var(--input);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-top: 15px;
    font-size: 14px;
}

.small {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.7;
}

#pendingCount {
    margin-top: 12px;
}

/* ==============================
   11. MOBILE RESPONSIVENESS
============================== */

@media (max-width: 650px) {

    body {
        padding: 16px 12px;
    }

    .card {
        padding: 17px;
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
        gap: 18px;
    }

    .task {
        grid-template-columns: minmax(0, 1fr);
        gap: 8px;
    }

    .task-buttons {
        opacity: 1;
        visibility: visible;
        padding-left: 28px;
        flex-wrap: wrap;
    }

    header h1 {
        font-size: 27px;
    }

    .stat strong {
        font-size: 25px;
    }
}

</style>
</head>

}

        records[date] = {

            statuses: {},

            wakeTime: "",

            sleepTime: "",

            note: ""

        };

    }


    if (!records[date].statuses) {

        records[date].statuses = {};

    }


    return records[date];

}


/* ==================================
   6. SAVE DATA
================================== */

function saveData() {

    localStorage.setItem(

        "lifeos_bilingual_tasks",

        JSON.stringify(tasks)

    );


    localStorage.setItem(

        "lifeos_bilingual_records",

        JSON.stringify(records)

    );

}


function saveDailyDetails() {

    const record = getDayRecord();

    record.wakeTime = document.getElementById("wakeTime").value;

    record.sleepTime = document.getElementById("sleepTime").value;

    record.note = document.getElementById("dailyNote").value;

    saveData();

}


/* ==================================
   7. RENDER TASKS
================================== */

function renderTasks() {

    const record = getDayRecord();

    const main = document.getElementById("mainTasks");

    const other = document.getElementById("otherTasks");

    main.innerHTML = "";

    other.innerHTML = "";


    tasks.forEach(task => {

        const status = record.statuses[task.id] || "";


        // Create habit row

        const row = document.createElement("div");

        row.className = "task";


        // Habit name

        const name = document.createElement("div");

        name.className = "task-name";


        // Status circle

        const indicator = document.createElement("span");

        indicator.className = "status-dot";


        if (status === "yes") {

            indicator.classList.add("yes");

            indicator.textContent = "✓";

        }

        else if (status === "no") {

            indicator.classList.add("no");

            indicator.textContent = "×";

        }

        else if (status === "skip") {

            indicator.classList.add("skip");

            indicator.textContent = "−";

        }


        const taskText = document.createElement("span");

        taskText.textContent = getTaskName(task);


        name.append(indicator, taskText);


        // Action buttons

        const buttons = document.createElement("div");

        buttons.className = "task-buttons";


        const complete = document.createElement("button");

        complete.className = "complete-action";

        complete.textContent = t("completeAction");

        complete.onclick = () => markTask(task.id, "yes");


        const skip = document.createElement("button");

        skip.className = "skip-action";

        skip.textContent = t("skip");

        skip.onclick = () => markTask(task.id, "skip");


        const fail = document.createElement("button");

        fail.className = "fail-action";

        fail.textContent = t("failAction");

        fail.onclick = () => markTask(task.id, "no");


        const del = document.createElement("button");

        del.className = "delete";

        del.textContent = "×";

        del.title = t("delete");

        del.onclick = () => deleteTask(task.id);


        buttons.append(complete, skip, fail, del);


        row.append(name, buttons);


        if (task.category === "main") {

            main.appendChild(row);

        }

        else {

            other.appendChild(row);

        }

    });


    // Restore daily details

    document.getElementById("wakeTime").value =
        record.wakeTime || "";

    document.getElementById("sleepTime").value =
        record.sleepTime || "";

    document.getElementById("dailyNote").value =
        record.note || "";


    updateStats();

    hideReport();

}


/* ==================================
   8. MARK TASK
================================== */

function markTask(id, status) {

    const record = getDayRecord();


    if (status === "") {

        delete record.statuses[id];

    }

    else {

        record.statuses[id] = status;

    }


    saveData();

    renderTasks();

}


/* ==================================
   9. ADD TASK
================================== */

function addTask() {

    const input = document.getElementById("newTask");

    const name = input.value.trim();


    if (!name) {

        alert(t("noName"));

        return;

    }


    const newId = tasks.length

        ? Math.max(...tasks.map(task => task.id)) + 1

        : 1;


    const newTask = {

        id: newId,

        en: name,

        ur: name,

        category: document.getElementById("taskCategory").value

    };


    tasks.push(newTask);


    input.value = "";


    saveData();

    renderTasks();

}


/* ==================================
   10. DELETE TASK
================================== */

function deleteTask(id) {

    if (!confirm(t("confirmDelete"))) {

        return;

    }


    tasks = tasks.filter(task => task.id !== id);


    for (const date in records) {

        if (records[date].statuses) {

            delete records[date].statuses[id];

        }

    }


    saveData();

    renderTasks();

}


/* ==================================
   11. STATISTICS
================================== */

function calculateStats() {

    const record = getDayRecord();

    let completed = 0;

    let missed = 0;

    let skipped = 0;

    let pending = 0;


    tasks.forEach(task => {

        const status = record.statuses[task.id];


        if (status === "yes") {

            completed++;

        }

        else if (status === "no") {

            missed++;

        }

        else if (status === "skip") {

            skipped++;

        }

        else {

            pending++;

        }

    });


    const total = tasks.length;


    const percentage = total > 0

        ? Math.round((completed / total) * 1000) / 10

        : 0;


    return {

        total,

        completed,

        missed,

        skipped,

        pending,

        percentage

    };

}


function updateStats() {

    const s = calculateStats();


    document.getElementById("total").textContent = s.total;

    document.getElementById("completed").textContent = s.completed;

    document.getElementById("missed").textContent = s.missed;

    document.getElementById("percentage").textContent =
        s.percentage + "%";


    document.getElementById("pendingCount").textContent =

        t("pending") + ": " + s.pending +

        " | " +

        t("skipped") + ": " + s.skipped;

}


/* ==================================
   12. FORMAT DATE AND TIME
================================== */

function formatDate(date) {

    if (!date) {

        return language === "ur" ? "درج نہیں" : "Not entered";

    }


    const parts = date.split("-");


    const d = new Date(

        Number(parts[0]),

        Number(parts[1]) - 1,

        Number(parts[2])

    );


    return new Intl.DateTimeFormat(

        language === "ur" ? "ur-PK" : "en-GB",

        {

            day: "numeric",

            month: "long",

            year: "numeric"

        }

    ).format(d);

}


function formatTime(time) {

    if (!time) {

        return language === "ur" ? "درج نہیں" : "Not entered";

    }


    const [hour, minute] = time.split(":");

    let h = Number(hour);


    if (language === "ur") {

        const period = h >= 12 ? "شام" : "صبح";

        h = h % 12 || 12;

        return `${h}:${minute} ${period}`;

    }


    const period = h >= 12 ? "PM" : "AM";

    h = h % 12 || 12;


    return `${h}:${minute} ${period}`;

}


/* ==================================
   13. GENERATE REPORT
================================== */

function generateReport() {

    if (!selectedDate()) {

        alert(t("noDate"));

        return;

    }


    if (tasks.length === 0) {

        alert(t("noTasks"));

        return;

    }


    saveDailyDetails();


    const record = getDayRecord();

    const stats = calculateStats();

    const lines = [];


    // Report title

    lines.push(

        language === "ur"

            ? "🌙 *روزانہ معمولات کی رپورٹ*"

            : "🌙 *DAILY ROUTINE REPORT*"

    );


    lines.push("━━━━━━━━━━━━━━━━━━");


    lines.push(

        t("dateReport") + ": " + formatDate(selectedDate())

    );


    lines.push(

        t("wakeReport") + ": " + formatTime(record.wakeTime)

    );


    lines.push(

        t("sleepReport") + ": " + formatTime(record.sleepTime)

    );


    // Add habit categories

    function addCategory(category, heading) {

        lines.push("");

        lines.push("*" + heading + "*");

        lines.push("━━━━━━━━━━━━━━━━━━");


        let number = 1;


        tasks

        .filter(task => task.category === category)

        .forEach(task => {

            const status = record.statuses[task.id];


            let symbol = "➖";

            let label = t("blankWord");


            if (status === "yes") {

                symbol = "✅";

                label = t("completedWord");

            }

            else if (status === "no") {

                symbol = "❌";

                label = t("missedWord");

            }

            else if (status === "skip") {

                symbol = "⏭️";

                label = t("skippedWord");

            }


            lines.push(

                number + ". " +

                getTaskName(task) +

                " — " +

                symbol + " " +

                label

            );


            number++;

        });

    }


    addCategory("main", t("mainReport"));

    addCategory("other", t("otherReport"));


    // Daily note

    if (record.note.trim()) {

        lines.push("");

        lines.push("*" + t("noteReport") + "*");

        lines.push(record.note.trim());

    }


    // Statistics

    lines.push("");

    lines.push("*" + t("summary") + "*");

    lines.push("━━━━━━━━━━━━━━━━━━");


    lines.push(

        t("totalReport") + ": " + stats.total

    );


    lines.push(

        "✅ " + t("completedReport") + ": " + stats.completed

    );


    lines.push(

        "❌ " + t("missedReport") + ": " + stats.missed

    );


    lines.push(

        "⏭️ " + t("skippedReport") + ": " + stats.skipped

    );


    lines.push(

        "➖ " + t("pendingReport") + ": " + stats.pending

    );


    lines.push(

        t("rate") + ": " + stats.percentage + "%"

    );


    lines.push("");

    lines.push(t("footer"));

    lines.push("_" + t("generated") + "_");


    reportText = lines.join("\n");


    document.getElementById("report").textContent = reportText;

    document.getElementById("reportSection").style.display = "block";


    saveData();

}


/* ==================================
   14. COPY REPORT
================================== */

async function copyReport() {

    if (!reportText) {

        alert(t("generateFirst"));

        return;

    }


    try {

        await navigator.clipboard.writeText(reportText);

        alert(t("copied"));

    }

    catch (error) {

        alert(t("copyError"));

    }

}


/* ==================================
   15. WHATSAPP SHARING
================================== */

function sendWhatsApp() {

    if (!reportText) {

        alert(t("generateFirst"));

        return;

    }


    const phone = document.getElementById("phone").value;

    const digits = phone.replace(/\D/g, "");


    if (digits.length < 10 || digits.length > 15) {

        alert(t("invalidPhone"));

        return;

    }


    const url =

        "https://wa.me/" + digits +

        "?text=" + encodeURIComponent(reportText);


    window.open(url, "_blank");

}


/* ==================================
   16. HIDE OLD REPORT
================================== */

function hideReport() {

    reportText = "";

    document.getElementById("reportSection").style.display = "none";

}


/* ==================================
   17. EVENT LISTENERS
================================== */

document.getElementById("language").addEventListener(

    "change",

    setLanguage

);


document.getElementById("date").addEventListener(

    "change",

    renderTasks

);


document.getElementById("wakeTime").addEventListener(

    "change",

    saveDailyDetails

);


document.getElementById("sleepTime").addEventListener(

    "change",

    saveDailyDetails

);


document.getElementById("dailyNote").addEventListener(

    "input",

    saveDailyDetails

);


// Press Enter to add a habit

document.getElementById("newTask").addEventListener(

    "keydown",

    function(event) {

        if (event.key === "Enter") {

            addTask();

        }

    }

);


/* ==================================
   18. START APPLICATION
================================== */

document.getElementById("language").value = language;

applyLanguage();

renderTasks();

</script>
